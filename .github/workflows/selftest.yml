name: selftest
on:
  push:
  pull_request:
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Step ids match between the checklist and the hub
        run: python skills/blastoff/scripts/launchpad.py check
      - name: Tracker, planner, site checker and seal
        run: python skills/blastoff/scripts/selftest.py
